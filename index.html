<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vantrix117</title>
<style>:root { color-scheme: light dark; --bg: #f6f3fb; --card: #ffffff; --ink: #1d1b26; --muted: #5d5870; --accent: #5b4bc4; --ring: rgba(91,75,196,.35); }
@media (prefers-color-scheme: dark) { :root { --bg: #14121b; --card: #221f2d; --ink: #f1eef8; --muted: #b9b2cc; --accent: #c3b8ff; --ring: rgba(195,184,255,.4); } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
main { max-width: 28rem; width: 100%; background: var(--card); border-radius: 22px; padding: 32px 24px; text-align: center; box-shadow: 0 1px 2px rgba(30,20,60,.06), 0 12px 32px rgba(30,20,60,.08); }
h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -.01em; }
p { margin: 0 0 16px; color: var(--muted); }
a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; transition: transform .15s; }
@media (prefers-color-scheme: dark) { a.btn { color: #14121b; } }
a.btn:active { transform: scale(.97); }
a.btn:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }</style>
</head>
<body><main><h1>Nothing here</h1><p>This address has no page of its own.</p></main></body>
</html>
